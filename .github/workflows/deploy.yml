name: Deploy produção via FTP

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy produção
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: FTP Deploy Locaweb — Produção
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.HOST }}
          user: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          localDir: "./"
          remoteDir: "./public_html/"
          # Inclui arquivos ocultos, especialmente .htaccess (tratamento HTTP 404).
          # Não publica arquivos internos do GitHub nem o CNAME legado.
          options: '--all --exclude-glob .github/** --exclude-glob CNAME'
