name: Deploy produção via FTP

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy produção
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: FTP Deploy Locaweb — Produção
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.HOST }}
          user: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          localDir: "./"
          remoteDir: "./public_html/"
          # O lftp mirror já pode transferir arquivos ocultos, incluindo .htaccess.
          # Exclui metadados do repositório e arquivo CNAME da publicação.
          options: '--exclude-glob .git/** --exclude-glob .github/** --exclude-glob CNAME --exclude-glob README.md --exclude-glob blog --exclude-glob blog/** --exclude-glob homolog --exclude-glob homolog/**'
