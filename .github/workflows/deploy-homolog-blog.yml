name: Deploy homologação Blog GEB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'blog/**'

jobs:
  deploy:
    name: Deploy homologação
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: FTP Deploy Locaweb — Homologação Blog
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.HOST }}
          user: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          localDir: "./blog/"
          remoteDir: "./public_html/homolog/"
